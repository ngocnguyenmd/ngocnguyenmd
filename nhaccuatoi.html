<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundWave</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#0a0a0c;color:#eeeef0;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}
input{font-family:inherit}img{display:block}
</style>
</head>
<body>

<div id="toast" style="position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px"></div>

<div id="qm" style="display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.6);align-items:center;justify-content:center">
  <div style="background:#18181c;border:1px solid #28282f;border-radius:12px;padding:20px;width:90%;max-width:340px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <b style="font-size:15px">Chat luong tai</b>
      <button onclick="document.getElementById('qm').style.display='none'" style="width:28px;height:28px;border-radius:50%;background:#28282f;display:flex;align-items:center;justify-content:center;font-size:12px;color:#6b6b78"><i class="fas fa-times"></i></button>
    </div>
    <div id="ql"></div>
  </div>
</div>

<div style="display:flex;flex-direction:column;min-height:100vh">

  <header style="position:sticky;top:0;z-index:50;background:rgba(10,10,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid #1f1f25;padding:0 16px">
    <div style="max-width:640px;margin:0 auto;height:52px;display:flex;align-items:center;gap:10px">
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#e85d3a,#f0a830);display:flex;align-items:center;justify-content:center">
          <i class="fas fa-wave-square" style="color:#fff;font-size:11px"></i>
        </div>
        <b id="logo" style="font-size:16px;display:none">SoundWave</b>
      </div>
      <div style="flex:1;position:relative">
        <i class="fas fa-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#6b6b78;font-size:12px"></i>
        <input id="si" type="text" placeholder="Loc bai hat..." style="width:100%;background:#18181c;border:1px solid #28282f;border-radius:20px;padding:8px 36px 8px 34px;font-size:13px;color:#eeeef0;outline:none" oninput="filterSongs()">
        <button id="clr" onclick="clearS()" style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#6b6b78;font-size:12px"><i class="fas fa-xmark"></i></button>
      </div>
    </div>
  </header>

  <main style="flex:1;max-width:640px;margin:0 auto;width:100%;padding:16px 16px 180px">
    <div style="display:flex;gap:6px;margin-bottom:14px">
      <button class="tb on" data-t="songs" onclick="stab('songs')" style="padding:6px 14px;border-radius:16px;font-size:12px;font-weight:600;background:#e85d3a;color:#fff"><i class="fas fa-music" style="margin-right:5px;font-size:10px"></i>Bai hat <span id="sc" style="margin-left:4px;opacity:.7"></span></button>
      <button class="tb" data-t="artists" onclick="stab('artists')" style="padding:6px 14px;border-radius:16px;font-size:12px;font-weight:600;background:transparent;color:#6b6b78"><i class="fas fa-microphone" style="margin-right:5px;font-size:10px"></i>Nghe si</button>
      <button class="tb" data-t="albums" onclick="stab('albums')" style="padding:6px 14px;border-radius:16px;font-size:12px;font-weight:600;background:transparent;color:#6b6b78"><i class="fas fa-compact-disc" style="margin-right:5px;font-size:10px"></i>Album</button>
    </div>

    <div id="rs"></div>
    <div id="ra" style="display:none"></div>
    <div id="rb" style="display:none"></div>

    <div id="ld" style="text-align:center;padding:60px 0">
      <div style="width:40px;height:40px;border:3px solid #28282f;border-top-color:#e85d3a;border-radius:50%;margin:0 auto 12px"></div>
      <p style="color:#6b6b78;font-size:13px">Dang tai du lieu...</p>
    </div>

    <div id="em" style="display:none;text-align:center;padding:60px 0">
      <div style="width:56px;height:56px;border-radius:50%;background:#18181c;margin:0 auto 12px;display:flex;align-items:center;justify-content:center"><i class="fas fa-filter" style="font-size:20px;color:#6b6b78"></i></div>
      <p style="color:#6b6b78;font-size:14px">Khong co bai hat phu hop</p>
    </div>
  </main>
</div>

<footer id="pb" style="position:fixed;bottom:0;left:0;right:0;z-index:50;background:#111114;border-top:1px solid #28282f;transform:translateY(100%);transition:transform .3s">
  <div style="max-width:640px;margin:0 auto;padding:0 16px">
    <div id="pw" style="height:4px;background:#28282f;border-radius:2px;cursor:pointer;margin-top:-1px" onmousedown="skS(event)" ontouchstart="skT(event)">
      <div id="pbr" style="height:100%;width:0%;background:#e85d3a;border-radius:2px"></div>
    </div>
    <div style="padding:8px 0;display:flex;align-items:center;gap:12px">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
        <img id="pi" src="" style="width:40px;height:40px;border-radius:8px;background:#28282f;flex-shrink:0;object-fit:cover">
        <div style="min-width:0">
          <div id="pn" style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">--</div>
          <div id="pa" style="font-size:11px;color:#6b6b78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px">--</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button onclick="prev()" style="font-size:14px;color:#6b6b78;padding:4px"><i class="fas fa-backward-step"></i></button>
        <button onclick="tp()" id="bp" style="width:36px;height:36px;border-radius:50%;background:#e85d3a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px"><i class="fas fa-play" style="margin-left:2px"></i></button>
        <button onclick="next()" style="font-size:14px;color:#6b6b78;padding:4px"><i class="fas fa-forward-step"></i></button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end">
        <span id="td" style="font-size:11px;color:#6b6b78;font-variant-numeric:tabular-nums">0:00/0:00</span>
        <button onclick="dlOpen()" style="font-size:12px;color:#6b6b78;padding:4px" title="Tai nhac"><i class="fas fa-download"></i></button>
      </div>
    </div>
  </div>
</footer>

<audio id="au" preload="auto"></audio>

<script>
// === DỮ LIỆU ===
let ALL_SONGS = [], ALL_ARTISTS = [], ALL_ALBUMS = [];
let filtered = [];

// === LOAD DATA.JSON (cùng origin, không CORS) ===
fetch('./data.json')
  .then(r => r.json())
  .then(data => {
    ALL_SONGS = data.songs || [];
    ALL_ARTISTS = data.artists || [];
    ALL_ALBUMS = data.albums || [];
    filtered = ALL_SONGS.slice();
    document.getElementById('ld').style.display = 'none';
    document.getElementById('sc').textContent = '(' + ALL_SONGS.length + ')';
    render();
    toast('ok', 'Da tai ' + ALL_SONGS.length + ' bai hat');
  })
  .catch(e => {
    document.getElementById('ld').style.display = 'none';
    toast('er', 'Khong tai duoc data.json. Kiem tra file?');
  });

// === LỌC BÀI HÁT (không cần API, lọc trên data đã có) ===
function filterSongs() {
  const kw = document.getElementById('si').value.trim().toLowerCase();
  document.getElementById('clr').style.display = kw ? 'block' : 'none';
  if (!kw) {
    filtered = ALL_SONGS.slice();
  } else {
    filtered = ALL_SONGS.filter(s =>
      s.name.toLowerCase().includes(kw) ||
      (s.artistName || '').toLowerCase().includes(kw) ||
      (s.genreName || '').toLowerCase().includes(kw)
    );
  }
  document.getElementById('sc').textContent = '(' + filtered.length + ')';
  document.getElementById('em').style.display = filtered.length ? 'none' : 'block';
  renderSongs();
}

function clearS() {
  document.getElementById('si').value = '';
  document.getElementById('clr').style.display = 'none';
  filtered = ALL_SONGS.slice();
  document.getElementById('sc').textContent = '(' + filtered.length + ')';
  document.getElementById('em').style.display = 'none';
  renderSongs();
}

// === RENDER ===
function render() { renderSongs(); renderArtists(); renderAlbums(); }

function renderSongs() {
  let h = '';
  filtered.forEach((s, i) => {
    // Tìm index trong ALL_SONGS để play đúng
    const realI = ALL_SONGS.indexOf(s);
    h += '<div onclick="play('+realI+')" style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;'+(S.ci===realI?'background:rgba(232,93,58,.1)':'')+'">'
      + '<div style="width:24px;text-align:center;font-size:12px;color:#6b6b78;flex-shrink:0">'+(i+1)+'</div>'
      + '<img src="'+(s.image||'')+'" style="width:42px;height:42px;border-radius:6px;object-fit:cover;flex-shrink:0;background:#222228" loading="lazy">'
      + '<div style="flex:1;min-width:0">'
      + '<div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(s.name)+'</div>'
      + '<div style="font-size:11px;color:#6b6b78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px">'+esc(s.artistName||'')+(s.genreName?' · '+esc(s.genreName):'')+'</div>'
      + '</div>'
      + '<div style="font-size:11px;color:#6b6b78;flex-shrink:0">'+fmtT(s.duration)+'</div>'
      + '<button onclick="event.stopPropagation();dlS('+realI+')" style="width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,.05);color:#6b6b78;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0" title="Tai"><i class="fas fa-download"></i></button>'
      + '</div>';
  });
  document.getElementById('rs').innerHTML = h;
}

function renderArtists() {
  let h = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:12px">';
  ALL_ARTISTS.forEach(a => {
    h += '<div onclick="searchArt(\''+esc(a.name).replace(/'/g,"\\'")+'\')" style="text-align:center;cursor:pointer">'
      + '<img src="'+(a.image||'')+'" style="width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto 6px;display:block;background:#222228" loading="lazy">'
      + '<div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(a.name)+'</div>'
      + '<div style="font-size:10px;color:#6b6b78;margin-top:2px">'+fmtN(a.totalFollow)+'</div></div>';
  });
  document.getElementById('ra').innerHTML = h + '</div>';
}

function renderAlbums() {
  let h = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px">';
  ALL_ALBUMS.forEach(a => {
    h += '<div>'
      + '<img src="'+(a.image||'')+'" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;margin-bottom:6px;background:#222228" loading="lazy">'
      + '<div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(a.name)+'</div>'
      + '<div style="font-size:11px;color:#6b6b78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px">'+esc(a.artistName||'')+'</div></div>';
  });
  document.getElementById('rb').innerHTML = h + '</div>';
}

// === STATE ===
const S = { ci:-1, playing:false, repeat:0, vol:.8, dlQ:[], seeking:false };
const au = document.getElementById('au');
au.volume = S.vol;

// === PHÁT NHẠC ===
function play(i) {
  if (i < 0 || i >= ALL_SONGS.length) return;
  S.ci = i;
  const s = ALL_SONGS[i];
  document.getElementById('pb').style.transform = 'translateY(0)';
  document.getElementById('pn').textContent = s.name;
  document.getElementById('pa').textContent = s.artistName || '';
  document.getElementById('pi').src = s.image || '';
  S.dlQ = s.qualityDownload || [];

  const url = getURL(s);
  if (url) {
    au.src = url; au.load();
    au.play().then(() => { S.playing = true; upBP(); renderSongs(); }).catch(() => toast('er', 'Khong the phat'));
  } else toast('er', 'Khong co link stream');
}

function getURL(s) {
  if (!s.streamURL || !s.streamURL.length) return '';
  const h = s.streamURL.find(u => u.type==='320' && !u.onlyVIP);
  const l = s.streamURL.find(u => u.type==='128' && !u.onlyVIP);
  return (h || l || s.streamURL[0]).stream || '';
}

function tp() {
  if (S.ci === -1) { if (ALL_SONGS.length) play(0); return; }
  if (S.playing) { au.pause(); S.playing = false; }
  else { au.play().catch(()=>{}); S.playing = true; }
  upBP(); renderSongs();
}
function next() { if (!ALL_SONGS.length) return; play((S.ci+1) % ALL_SONGS.length); }
function prev() { if (!ALL_SONGS.length) return; play((S.ci-1+ALL_SONGS.length) % ALL_SONGS.length); }
function upBP() { document.getElementById('bp').innerHTML = S.playing ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play" style="margin-left:2px"></i>'; }

// === TIẾN ĐỘ ===
function skS(e) { S.seeking=true; doSk(e.clientX); document.onmousemove=ev=>{if(S.seeking)doSk(ev.clientX);}; document.onmouseup=()=>{S.seeking=false;document.onmousemove=null;document.onmouseup=null;}; }
function skT(e) { S.seeking=true; doSk(e.touches[0].clientX); }
document.getElementById('pw').ontouchmove = e => { if(S.seeking) doSk(e.touches[0].clientX); };
document.getElementById('pw').ontouchend = () => { S.seeking=false; };
function doSk(x) { if(!au.duration) return; const r=document.getElementById('pw').getBoundingClientRect(); au.currentTime=Math.max(0,Math.min(1,(x-r.left)/r.width))*au.duration; }

au.ontimeupdate = () => {
  if(S.seeking||!au.duration) return;
  document.getElementById('pbr').style.width = (au.currentTime/au.duration*100)+'%';
  document.getElementById('td').textContent = fmtT(au.currentTime)+'/'+fmtT(au.duration);
};
au.onended = () => {
  if(S.repeat===2) { au.currentTime=0; au.play(); }
  else if(S.repeat===1||S.ci<ALL_SONGS.length-1) next();
  else { S.playing=false; upBP(); renderSongs(); }
};
au.onerror = () => toast('er', 'Loi audio. Link het han?');

// === TẢI NHẠC ===
function dlOpen() { if(S.ci===-1){toast('er','Chua chon bai hat');return;} dlS(S.ci); }
function dlS(i) {
  const s=ALL_SONGS[i]; const q=s.qualityDownload||[];
  if(!q.length){toast('er','Khong co thong tin tai');return;}
  let h='';
  q.forEach(x => {
    const v=x.onlyVIP; const sz=x.fileSize?fmtSz(x.fileSize):'';
    h += '<div onclick="'+(v?'':'doDl('+i+',\''+x.key+'\')')+'" style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;cursor:'+(v?'not-allowed;opacity:.4':'pointer')+';border:1px solid transparent">'
      + '<div><div style="font-size:13px;font-weight:600">'+x.name+'</div><div style="font-size:11px;color:#6b6b78;margin-top:2px">'+sz+(v?' · VIP':' · Mien phi')+'</div></div>'
      + '<i class="fas '+(v?'fa-lock':'fa-download')+'" style="color:'+(v?'#6b6b78':'#e85d3a')+';font-size:13px"></i></div>';
  });
  document.getElementById('ql').innerHTML = h;
  document.getElementById('qm').style.display = 'flex';
}
function doDl(i, qk) {
  const s=ALL_SONGS[i]; let url='';
  if(s.streamURL) {
    const m=s.streamURL.find(u=>u.type===qk&&u.download);
    if(m) url=m.download;
    else { const st=s.streamURL.find(u=>u.type===qk); if(st) url=st.stream+(st.stream.includes('?')?'&download=true':'?download=true'); }
  }
  if(url) { const a=document.createElement('a'); a.href=url; a.download=s.name+' - '+s.artistName+'.mp3'; a.target='_blank'; document.body.appendChild(a); a.click(); a.remove(); toast('ok','Dang tai "'+s.name+'"'); }
  else toast('er','Khong co link tai');
  document.getElementById('qm').style.display = 'none';
}
document.getElementById('qm').onclick = function(e) { if(e.target===this) this.style.display='none'; };

// === TABS ===
function stab(t) {
  document.querySelectorAll('.tb').forEach(b => { b.style.background=b.dataset.t===t?'#e85d3a':'transparent'; b.style.color=b.dataset.t===t?'#fff':'#6b6b78'; });
  document.getElementById('rs').style.display = t==='songs'?'block':'none';
  document.getElementById('ra').style.display = t==='artists'?'block':'none';
  document.getElementById('rb').style.display = t==='albums'?'block':'none';
}

// === TÌM KIẾM TỪ ARTIST ===
function searchArt(n) { document.getElementById('si').value=n; stab('songs'); filterSongs(); }

// === TOAST ===
function toast(type, msg) {
  const d=document.createElement('div');
  const cl={ok:'#4ade80',er:'#f87171','in':'#60a5fa'};
  const ic={ok:'fa-circle-check',er:'fa-circle-xmark','in':'fa-circle-info'};
  d.style.cssText='padding:8px 14px;border-radius:8px;background:#18181c;border:1px solid #28282f;font-size:12px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.5)';
  d.innerHTML='<i class="fas '+ic[type]+'" style="color:'+cl[type]+';font-size:13px"></i><span>'+esc(msg)+'</span>';
  document.getElementById('toast').appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .2s';setTimeout(()=>d.remove(),200);},2500);
}

// === UTILS ===
function fmtT(s){if(!s||isNaN(s))return'0:00';const m=Math.floor(s/60);return m+':'+(Math.floor(s%60)<10?'0':'')+Math.floor(s%60);}
function fmtN(n){if(!n)return'0';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return''+n;}
function fmtSz(b){if(!b)return'';if(b>=1048576)return(b/1048576).toFixed(1)+' MB';return(b/1024).toFixed(0)+' KB';}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// === PHÍM TẮT ===
document.onkeydown = e => {
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space'){e.preventDefault();tp();}
  else if(e.code==='ArrowRight'&&au.duration) au.currentTime=Math.min(au.duration,au.currentTime+5);
  else if(e.code==='ArrowLeft') au.currentTime=Math.max(0,au.currentTime-5);
  else if(e.code==='KeyN') next();
  else if(e.code==='KeyP') prev();
};

if(window.innerWidth>=640) document.getElementById('logo').style.display='block';
</script>
</body>
</html>
